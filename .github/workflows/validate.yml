name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.11 validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check out pinned AEGIS Core dependency

        uses: actions/checkout@v7

        with:

          repository: nosferatu3333/aegis-core

          ref: 1196aea3384466f713832ee28775459db4779790

          path: aegis-core

          ssh-key: ${{ secrets.AEGIS_CORE_DEPLOY_KEY }}

          persist-credentials: false


      - name: Install project and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./aegis-core"
          python -m pip install -e ".[test]"

      - name: Run repository validation
        run: python scripts/validate.py --allow-external-interpreter

      - name: Confirm validation did not change tracked files
        run: git diff --exit-code
