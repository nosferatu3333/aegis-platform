name: Repository validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.11 validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AEGIS_OPS_PATH: ${{ github.workspace }}/.aegis-deps/aegis-ops
      AEGIS_RC1_RELEASE_PATH: ${{ github.workspace }}/release-assets/aegis-platform-1.7.0-rc1-official.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check out pinned AEGIS Core dependency

        uses: actions/checkout@v7

        with:

          repository: nosferatu3333/aegis-core

          ref: 1196aea3384466f713832ee28775459db4779790

          path: aegis-core

          ssh-key: ${{ secrets.AEGIS_CORE_DEPLOY_KEY }}

          persist-credentials: false

      - name: Check out pinned AEGIS OPS dependency
        uses: actions/checkout@v7
        with:
          repository: nosferatu3333/aegis-ops
          ref: 2b702573f618184f31bca391d9a77588e7be9da3
          path: .aegis-deps/aegis-ops
          ssh-key: ${{ secrets.AEGIS_OPS_DEPLOY_KEY }}
          persist-credentials: false

      - name: Install project and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "./aegis-core"
          rm -rf aegis-core
          python -m pip install -e ".[test]"

      - name: Verify pinned AEGIS OPS dependency
        shell: bash
        run: |
          ops_head="$(git -C "$AEGIS_OPS_PATH" rev-parse HEAD)"
          printf 'OPS HEAD: %s\n' "$ops_head"
          test "$ops_head" = "2b702573f618184f31bca391d9a77588e7be9da3"
          test -d "$AEGIS_OPS_PATH/aegis_os/capabilities/modules"
          test -f "$AEGIS_OPS_PATH/aegis_os/capabilities/modules/iterative_ai_development.yaml"

      - name: Download official RC1 release
        shell: bash
        run: |
          mkdir -p "$(dirname "$AEGIS_RC1_RELEASE_PATH")"
          curl --fail --location --retry 3 --retry-delay 2 --retry-all-errors \
            --output "$AEGIS_RC1_RELEASE_PATH" \
            "https://github.com/nosferatu3333/aegis-platform/releases/download/v1.7.0-rc1/aegis-platform-1.7.0-rc1-official.zip"

      - name: Verify official RC1 release
        shell: bash
        run: |
          test "$(basename "$AEGIS_RC1_RELEASE_PATH")" = "aegis-platform-1.7.0-rc1-official.zip"
          test -f "$AEGIS_RC1_RELEASE_PATH"
          observed_size="$(stat -c %s "$AEGIS_RC1_RELEASE_PATH")"
          observed_sha256="$(sha256sum "$AEGIS_RC1_RELEASE_PATH" | cut -d ' ' -f 1)"
          printf 'RC1 size: %s\n' "$observed_size"
          printf 'RC1 SHA-256: %s\n' "$observed_sha256"
          test "$observed_size" = "413950"
          test "$observed_sha256" = "fff6e6f75baf562700c11379e7a20f700d5b10005a70e18a95c8ab11d429d8d4"
      - name: Diagnose RC1 Linux extraction shape
        shell: bash
        run: |
          python - <<'PY'
          import os
          import tempfile
          import zipfile
          from pathlib import Path

          release = Path(
              os.environ["AEGIS_RC1_RELEASE_PATH"]
          ).resolve()

          def escaped(value: str) -> str:
              return value.encode(
                  "unicode_escape"
              ).decode("ascii")

          print("=== RC1 LINUX EXTRACTION SHAPE ===")

          with zipfile.ZipFile(release) as archive:
              infos = archive.infolist()

              print(f"member_count={len(infos)}")

              for index, info in enumerate(infos, 1):
                  print(
                      f"member_{index}="
                      f"{escaped(info.filename)}"
                  )
                  print(
                      f"member_{index}_is_dir="
                      f"{info.is_dir()}"
                  )
                  print(
                      f"member_{index}_create_system="
                      f"{info.create_system}"
                  )
                  print(
                      f"member_{index}_external_attr="
                      f"{info.external_attr}"
                  )

              with tempfile.TemporaryDirectory(
                  prefix="aegis-rc1-linux-extract-"
              ) as temp:
                  root = Path(temp) / "release"
                  root.mkdir(parents=True)

                  archive.extractall(root)

                  extracted = sorted(
                      root.rglob("*"),
                      key=lambda path: path.as_posix(),
                  )

                  print(
                      f"extracted_entry_count="
                      f"{len(extracted)}"
                  )

                  for index, path in enumerate(
                      extracted, 1
                  ):
                      relative = path.relative_to(root)

                      print(
                          f"extracted_{index}="
                          f"{escaped(relative.as_posix())}"
                      )
                      print(
                          f"extracted_{index}_is_file="
                          f"{path.is_file()}"
                      )
                      print(
                          f"extracted_{index}_is_dir="
                          f"{path.is_dir()}"
                      )

                  manifest_matches = [
                      path
                      for path in root.rglob(
                          "RELEASE_CANDIDATE_MANIFEST.json"
                      )
                      if path.is_file()
                  ]

                  print(
                      "manifest_match_count="
                      + str(len(manifest_matches))
                  )

                  for path in manifest_matches:
                      print(
                          "manifest_match="
                          + escaped(
                              path.relative_to(root).as_posix()
                          )
                      )

          print("=== END RC1 LINUX EXTRACTION SHAPE ===")
          PY
      - name: Diagnose Domain F proof failure
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import tempfile
          from pathlib import Path

          from aegis_os.proof.domain_f import run_domain_f

          release = Path(
              os.environ["AEGIS_RC1_RELEASE_PATH"]
          ).expanduser().resolve()

          with tempfile.TemporaryDirectory(
              prefix="aegis-domain-f-ci-diagnostic-"
          ) as temp:
              aggregate, directory = run_domain_f(
                  output_root=Path(temp),
                  release_zip=release,
              )

              print("=== DOMAIN F LINUX DIAGNOSTIC ===")
              print(
                  "aggregate_verdict="
                  + str(aggregate.get("overall_domain_verdict"))
              )
              print(
                  "scenarios_executed="
                  + str(aggregate.get("scenarios_executed"))
              )
              print(
                  "passed="
                  + str(aggregate.get("passed"))
              )
              print(
                  "failed="
                  + str(aggregate.get("failed"))
              )
              print(
                  "blocked="
                  + str(aggregate.get("blocked"))
              )

              for scenario_id in (
                  "AEGIS-RC1-S19",
                  "AEGIS-RC1-S20",
              ):
                  result_path = directory / f"{scenario_id}.json"

                  if not result_path.is_file():
                      print("---")
                      print(f"scenario_id={scenario_id}")
                      print("RESULT_FILE_MISSING")
                      continue

                  payload = json.loads(
                      result_path.read_text(encoding="utf-8")
                  )

                  print("---")
                  print(f"scenario_id={scenario_id}")
                  print(
                      "actual_canonical_outcome="
                      + str(
                          payload.get(
                              "actual_canonical_outcome"
                          )
                      )
                  )
                  print(
                      "failure_reason="
                      + str(payload.get("failure_reason"))
                  )

              print("=== END DOMAIN F LINUX DIAGNOSTIC ===")
          PY
      - name: Run repository validation
        run: |
          python -m pip check
          python -m aegis_os doctor
          python scripts/release_acceptance.py
          python -m pre_commit validate-config
          python -m pytest -q -p no:cacheprovider
          git diff --check HEAD --
      - name: Confirm validation did not change tracked files
        run: git diff --exit-code
