[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "aegis-os"
version = "0.1.0"
description = "A Cognitive Operating System for Autonomous Intelligence"
authors = [
    {name = "Aegis Labs"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.46,<1",
    "uvicorn>=0.30,<1",
]


[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pre-commit>=4.6,<5",
    "pytest>=8,<10",
    "ruff>=0.15.22,<0.16",
]


[tool.setuptools.packages.find]
where = ["."]


[tool.ruff]
target-version = "py311"
line-length = 88


[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = false
