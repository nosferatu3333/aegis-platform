[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "aegis-os"
version = "0.1.0"
description = "A Cognitive Operating System for Autonomous Intelligence"
authors = [
    {name = "Aegis Labs"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "starlette>=0.46,<1",
    "uvicorn>=0.30,<1",
]


[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]


[tool.setuptools.packages.find]
where = ["."]
